# CrowdSec Config
crowdsec_lapi_url: http://localhost:8080/
crowdsec_lapi_key: ${API_KEY}
# Optional persisted decision state (one file per account, {account} is replaced).
state_file: # /var/lib/cs-cloudflare-bouncer/state_{account}.json
# Secrets may also be read from files: crowdsec_lapi_key_file,
# account token_file, unifi.password_file (never set both inline and _file).
crowdsec_update_frequency: 10s

include_scenarios_containing: [] # ignore IPs banned for triggering scenarios not containing either of provided word EG ["http"]
exclude_scenarios_containing: [] # ignore IPs banned for triggering scenarios containing either of provided word EG ["ssh", "smb"]
only_include_decisions_from: [] #  only include IPs banned due to decisions orginating from provided sources. EG ["cscli", "crowdsec"]

#Cloudflare Config. 
cloudflare_config:
  accounts: 
  - id: 
    token: 
    ip_list_prefix: crowdsec
    ip_list_name: wafblocklist # neutral name: Cloudflare limits *CrowdSec-named* lists to one bulk update per 24h
    default_action: managed_challenge
    zones:
    - actions: 
      - managed_challenge # valid choices are either of managed_challenge, js_challenge, block
      zone_id:
    

  update_frequency: 5m # how often to reconcile the IP list with the most relevant decisions
  full_resync_frequency: 168h # weekly full LAPI resync to heal drift

  # Decisions are ranked by severity before filling the 10k list; recency is only a tiebreaker.
  ranking:
    patterns:
    - name: zero_day
      pattern: '(?i)(0day|zero.?day|cve-{{YEAR}})'
      score: 100
    - name: exploit
      pattern: '(?i)(exploit|rce|sqli|lfi|xxe|ssrf|webshell)'
      score: 80
    - name: brute_force
      pattern: '(?i)(bf|brute|credential|spray)'
      score: 40
    - name: scanning
      pattern: '(?i)(scan|probe|crawl|bot)'
      score: 10
    default_score: 20
    type_scores:
      ban: 20
      captcha: 5
      js_challenge: 5
    duration_bonus_per_hour: 1
    duration_bonus_max: 20
    origin_scores:
      crowdsec: 10
      CAPI: 10
      cscli: 0
      lists: 0

# Optional UniFi sync using the official API-key Network API.
# Create one firewall policy in UniFi that references this Traffic Matching List.
unifi:
  enabled: false
  mode: local # local UniFi OS console, or cloud connector
  url: https://10.0.24.1
  console_id: # required only for mode: cloud
  api_key: ${UNIFI_API_KEY}
  # api_key_file: /run/secrets/unifi_api_key
  site: default
  list_name: CrowdSec_Blocklist
  max_items: 10000
  insecure_skip_verify: false
  ca_file: # optional private/self-signed CA
  allow_insecure_http: false
  update_frequency: 5m

# Bouncer Config
daemon: false
log_mode: stdout
log_dir: /var/log/ 
log_level: info # valid choices are either debug, info, error 

prometheus:
  enabled: true
  listen_addr: 127.0.0.1
  listen_port: 2112
